<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6e6c8"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Ошибки ЧП</title></head><body><main class="app"><section class="hero"><div class="hero-copy"><p class="eyebrow">СПРАВОЧНИК АСУТП 🐾</p><h1>Ошибки ЧП</h1><p class="subtitle">Быстрый поиск и расшифровка ошибок частотных преобразователей</p><button id="installBtn" class="ghost" hidden>Установить приложение</button></div><div class="capy-scene" aria-hidden="true"><div class="sun"></div><div class="leaf leaf-a"></div><div class="leaf leaf-b"></div><div class="capy"><div class="ear ear-l"></div><div class="ear ear-r"></div><div class="body"></div><div class="head"><span class="eye eye-l"></span><span class="eye eye-r"></span><span class="nose"></span><span class="smile"></span></div><div class="cup">АСУТП</div></div><div class="ground"></div></div></section><section class="panel controls"><div class="panel-title"><span class="paw">🐾</span><div><strong>Поиск ошибки</strong><small>Выбери модель и введи код</small></div></div><label>Преобразователь<select id="driveSelect"></select></label><label>Тип события<select id="categorySelect"></select></label><label>Код ошибки<input id="codeInput" autocomplete="off" inputmode="text" placeholder="Например, A01006 или 1006"></label><button id="searchBtn" class="primary">🔎 Найти ошибку</button></section><section id="status" class="status">Загрузка базы…</section><section id="result" class="result" hidden></section><section class="panel recent"><div class="section-title"><div><h2>Недавние запросы</h2><small>Работаем без паники</small></div><button id="clearHistoryBtn" class="link">Очистить</button></div><div id="history" class="chips"></div></section><nav class="bottom-nav" aria-label="Навигация"><button class="nav-item active">⌂<span>Главная</span></button><button class="nav-item">◷<span>История</span></button><button class="nav-mascot" aria-label="Капибара">🦫</button><button class="nav-item">☆<span>Избранное</span></button><button class="nav-item">☰<span>Ещё</span></button></nav></main><script src="app.js" defer></script></body></html>
