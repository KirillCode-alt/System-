<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ec"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Справочник ошибок ЧП</title></head><body><main class="phone"><section id="homeScreen" class="screen active"><div class="hero"><div class="hero-text"><h1>СПРАВОЧНИК<br>ОШИБОК ЧП <span>🐾</span></h1><p>Быстрый поиск и расшифровка ошибок частотных преобразователей</p></div><img src="assets/capy-home.webp" alt="Капибара АСУТП" class="hero-image"><button id="openSearch" class="search-entry"><span class="entry-icon">⚙️</span><span><b>Поиск ошибки</b><small>Выбери модель и введи код</small></span><span>›</span></button></div><section class="content-block"><h2>Выберите производителя</h2><div id="manufacturerGrid" class="manufacturer-grid"></div></section></section><section id="searchScreen" class="screen"><header class="appbar"><button class="icon-btn back-home">‹</button><h2>Поиск ошибки</h2><span class="paw">🐾</span></header><div class="form-card"><label>Преобразователь</label><div class="select-box" data-select="drive"><button class="select-trigger" id="driveTrigger"><span>Выберите модель</span><i>⌄</i></button><div class="select-menu" id="driveMenu"></div></div><label>Тип события</label><div class="select-box" data-select="category"><button class="select-trigger" id="categoryTrigger"><span>Fault</span><i>⌄</i></button><div class="select-menu" id="categoryMenu"><button data-value="fault">Fault</button><button data-value="alarm">Alarm</button></div></div><label for="codeInput">Код ошибки</label><div class="code-wrap"><input id="codeInput" autocomplete="off" placeholder="Например, A01006 или 1006"><button id="clearCode">×</button></div><button id="searchBtn" class="primary">🔎 Найти ошибку</button><p id="status" class="status">Выберите модель и введите код</p></div><img src="assets/capy-search.webp" class="search-capy" alt="Капибара ищет ошибку"><div id="searchResults" class="search-results"></div></section><section id="detailScreen" class="screen"><header class="appbar"><button class="icon-btn back-search">‹</button><h2 id="detailCode">Ошибка</h2><button id="favoriteBtn" class="icon-btn favorite-btn" aria-label="Добавить в избранное">☆</button></header><article id="result" class="detail"></article></section><section id="historyScreen" class="screen"><header class="appbar"><button class="icon-btn back-home">‹</button><h2>История</h2><span class="paw">🐾</span></header><div class="list-wrap"><div id="history" class="record-list"></div><button id="clearHistoryBtn" class="secondary">🗑 Очистить историю</button></div></section><section id="favoritesScreen" class="screen"><header class="appbar"><button class="icon-btn back-home">‹</button><h2>Избранное</h2><span class="paw">🐾</span></header><div class="list-wrap"><div id="favorites" class="record-list"></div></div></section><nav class="bottom-nav"><button data-screen="homeScreen" class="active"><span>⌂</span>Главная</button><button data-screen="historyScreen"><span>◷</span>История</button><button data-screen="favoritesScreen"><span>☆</span>Избранное</button></nav></main><script src="app.js" defer></script></body></html>
